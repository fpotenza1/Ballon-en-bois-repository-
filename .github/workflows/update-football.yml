
name: Update Football Results

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  update-football:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger football import
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --max-time 540 \
            --retry 2 \
            --retry-delay 15 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.ballonenbois.com/api/import-football"
