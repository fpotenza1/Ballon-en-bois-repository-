<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Ballon en Bois — Football's Reality Awards. Satirical football awards, rankings, results and fixtures.">
<title>Ballon en Bois — Football's Reality Awards</title>

<style>
/* ================================================
   BALLON EN BOIS — UNIFIED DESIGN SYSTEM
   White background · Yellow cards · Black text
================================================ */

:root {
  --white: #ffffff;
  --black: #191a17;
  --yellow: #ffe56b;
  --yellow-light: #fff0a6;
  --yellow-border: #e8cb4d;
  --wood: #916e50;
  --muted: #6e6e68;
  --border: #e7e7e3;
  --radius: 12px;
  --shadow: 0 5px 18px rgba(0,0,0,.035);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--white);
  color: var(--black);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid var(--wood);
  outline-offset: 3px;
}

.wrap {
  width: min(1200px, calc(100% - 64px));
  margin-inline: auto;
}

/* HEADER */

.top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}

.nav {
  min-height: 84px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.mark {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border: 2px solid var(--black);
  border-radius: 50%;
  font: 26px Georgia, serif;
  color: var(--wood);
}

.brandname {
  display: block;
  font: bold 23px Georgia, serif;
  letter-spacing: -.8px;
}

.brand small {
  display: block;
  margin-top: 4px;
  color: var(--wood);
  font-size: 8px;
  letter-spacing: 2.5px;
}

.links {
  display: flex;
  align-items: center;
  gap: 22px;
}

.links a {
  position: relative;
  padding: 12px 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.1px;
  text-transform: uppercase;
}

.links a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 5px;
  height: 3px;
  background: transparent;
  border-radius: 2px;
}

.links a.active::after,
.links a:hover::after {
  background: var(--yellow);
}

.edition {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
  white-space: nowrap;
}

.menu {
  display: none;
  border: 0;
  background: transparent;
  color: var(--black);
  font-size: 25px;
}

/* SHARED TYPOGRAPHY */

.eyebrow {
  color: var(--wood);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.pagehead {
  padding: 76px 0 46px;
}

.pagehead h1 {
  margin: 16px 0 20px;
  font: normal clamp(44px, 6vw, 74px)/1.04 Georgia, serif;
  letter-spacing: -2.5px;
}

.sub {
  max-width: 720px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.75;
}

.section {
  padding: 55px 0 80px;
}

.sectionhead {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 25px;
  margin-bottom: 26px;
}

.sectionhead h2 {
  margin: 12px 0;
  font: normal clamp(34px, 4.5vw, 55px)/1.1 Georgia, serif;
  letter-spacing: -1.8px;
}

.sectionhead .sub {
  max-width: 420px;
}

.textlink {
  padding-bottom: 6px;
  border-bottom: 2px solid var(--yellow-border);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  white-space: nowrap;
}

/* SHARED YELLOW CARDS */

.card {
  background: var(--yellow);
  color: var(--black);
  border: 1px solid var(--yellow-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.card:hover {
  border-color: #c6a930;
}

.card-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}

.card-title {
  margin: 15px 0;
  font: normal 30px/1.12 Georgia, serif;
}

.card-text {
  color: #484332;
  font-size: 13px;
  line-height: 1.65;
}

/* SHARED BUTTONS */

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  padding: 13px 20px;
  border: 1px solid var(--black);
  border-radius: 7px;
  background: var(--black);
  color: var(--white);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: background .15s, color .15s;
}

.btn:hover {
  background: #383a33;
}

.btn-yellow {
  background: var(--yellow);
  color: var(--black);
  border-color: var(--yellow-border);
}

.btn-yellow:hover {
  background: var(--yellow-light);
}

.btn-outline {
  background: var(--white);
  color: var(--black);
}

.btn-outline:hover {
  background: var(--yellow);
}

/* HOME PAGE */

.hero {
  display: grid;
  grid-template-columns: 1.12fr .88fr;
  align-items: center;
  gap: 35px;
  padding: 92px 0 85px;
}

.hero h1 {
  margin: 25px 0;
  font: normal clamp(65px, 8vw, 120px)/.94 Georgia, serif;
  letter-spacing: -5px;
}

.hero h1 em {
  font-style: normal;
  color: var(--wood);
}

.lead {
  margin: 0 0 25px;
  font: normal clamp(21px, 2.5vw, 30px)/1.35 Georgia, serif;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 30px;
}

.heroart {
  position: relative;
  min-height: 430px;
  display: grid;
  place-items: center;
  background: var(--yellow);
  border: 1px solid var(--yellow-border);
  border-radius: 20px;
  overflow: hidden;
}

.heroart::before {
  content: "";
  position: absolute;
  width: 82%;
  aspect-ratio: 1;
  border: 1px solid #c9aa3d;
  border-radius: 50%;
}

.heroart::after {
  content: "THE WOODEN BALL · 2026";
  position: absolute;
  bottom: 23px;
  color: #655529;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
}

.ball {
  position: relative;
  z-index: 1;
  width: min(310px, 78%);
  filter: drop-shadow(16px 21px 15px #0002);
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 18px;
}

.feature-card {
  min-height: 245px;
  padding: 27px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.feature-card h3 {
  margin: 0 0 12px;
  font: normal 31px Georgia, serif;
}

.feature-card p {
  margin: 0;
}

.feature-arrow {
  align-self: end;
  font-size: 23px;
}

.league-strip {
  padding: 28px 0;
  border-block: 1px solid var(--border);
}

.league-strip .wrap {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px;
}

.league-strip span {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* SHARED FILTERS */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 26px 0;
}

.control {
  min-width: 180px;
  min-height: 47px;
  padding: 12px 15px;
  border: 1px solid var(--yellow-border);
  border-radius: 7px;
  background: var(--yellow);
  color: var(--black);
  font-size: 13px;
}

.control::placeholder {
  color: #635d45;
}

.search {
  flex: 1;
  min-width: 210px;
}

/* NOMINEES */

.nominee-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 17px;
}

.nominee-card {
  min-height: 300px;
  padding: 27px;
  display: flex;
  flex-direction: column;
}

.nominee-card h3 {
  margin: 24px 0 7px;
  font: normal 31px Georgia, serif;
}

.nominee-club {
  font-size: 13px;
  color: #514b37;
}

.nominee-description {
  margin: 20px 0;
  color: #514b37;
  font-size: 13px;
  line-height: 1.65;
}

.nominee-bottom {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 15px;
  margin-top: auto;
  padding-top: 17px;
  border-top: 1px solid #d4b944;
}

.nominee-bottom span {
  font-size: 11px;
}

.nominee-bottom strong {
  font: normal 35px Georgia, serif;
}

/* RANKINGS */

.ranking-table {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 1px solid var(--yellow-border);
  background: var(--yellow);
}

.ranking-table table {
  width: 100%;
  min-width: 650px;
  border-collapse: collapse;
  text-align: left;
}

.ranking-table th {
  padding: 20px;
  background: #f5d85c;
  font-size: 10px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
}

.ranking-table td {
  padding: 20px;
  border-top: 1px solid #d9be4b;
  font-size: 13px;
}

.ranking-table td:first-child {
  font: normal 26px Georgia, serif;
}

.ranking-table td strong {
  font-size: 15px;
}

.ranking-table td small {
  display: block;
  margin-top: 6px;
  color: #61583b;
}

.ranking-score {
  font-size: 22px !important;
  font-weight: 700;
}

/* METHODOLOGY */

.method-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 18px;
}

.method-card {
  padding: 30px;
  min-height: 205px;
}

.method-weight {
  font: normal 48px Georgia, serif;
}

.method-card h3 {
  margin: 15px 0 10px;
  font: normal 25px Georgia, serif;
}

.method-card p {
  color: #514b37;
  font-size: 13px;
  line-height: 1.65;
}

/* NOTICES */

.notice {
  margin: 25px 0;
  padding: 19px 22px;
  border: 1px solid var(--yellow-border);
  border-radius: var(--radius);
  background: var(--yellow-light);
  color: #4d4530;
  font-size: 13px;
  line-height: 1.65;
}

.empty {
  padding: 35px;

  text-align: center;
  border: 1px solid var(--yellow-border);
  border-radius: var(--radius);
  background: var(--yellow-light);
  color: var(--black);
}

/* FOOTBALL DATA */

.football-controls {
  margin: 24px 0 19px;
}

.football-controls .control {
  min-width: 320px;
}

.football-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 23px;
}

.football-tab {
  min-height: 46px;
  padding: 13px 20px;
  border: 1px solid var(--yellow-border);
  border-radius: 7px;
  background: var(--yellow);
  color: var(--black);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.football-tab.active {
  background: var(--black);
  color: var(--white);
  border-color: var(--black);
}

.football-tab:not(.active):hover {
  background: var(--yellow-light);
}

.football-list {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 16px;
}

.football-match {
  min-width: 0;
  padding: 19px 21px 16px;
}

.match-top {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 12px;
  margin-bottom: 18px;
}

.match-competition {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.match-date {
  color: #504a34;
  font-size: 11px;
  text-align: right;
  white-space: nowrap;
}

.match-body {
  display: grid;
  grid-template-columns: minmax(0,1fr) 45px 82px;
  gap: 12px;
  align-items: center;
}

.match-teams,
.match-scores {
  display: grid;
  grid-template-rows: repeat(2,minmax(38px,auto));
  row-gap: 8px;
}

.match-team {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.team-name {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.team-logo {
  width: 34px;
  height: 34px;
  flex: none;
  object-fit: contain;
}

.team-fallback {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid #b69a37;
  border-radius: 50%;
  background: #fff8d4;
  color: var(--black);
  font-size: 10px;
  font-weight: 700;
}

.match-score {
  display: grid;
  place-items: center;
  font: bold 23px Georgia, serif;
}

.match-status {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding-left: 9px;
  border-left: 1px solid #d1b542;
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
}

.match-status-main {
  font-size: 12px;
}

.match-events {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 15px;
  padding-top: 12px;
  border-top: 1px solid #d1b542;
}

.match-events-side {
  font-size: 11px;
  line-height: 1.6;
}

.match-events-side:last-child {
  text-align: right;
}

.scorer-line {
  margin: 3px 0;
}

.football-message {
  grid-column: 1/-1;
  padding: 35px;
  border: 1px solid var(--yellow-border);
  border-radius: var(--radius);
  background: var(--yellow-light);
  text-align: center;
  font-size: 14px;
}

/* FOOTBALL NAVIGATION AND FRESHNESS */

.football-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 4px 0 22px;
}

.football-updated {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.football-matchday-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  margin: 0 0 20px;
}

.football-matchday-nav .control { min-width: 120px; }
.football-matchday-nav .btn { min-height: 45px; padding: 11px 15px; }
.football-matchday-nav .btn:disabled { opacity: .4; cursor: not-allowed; }

/* OFFICIAL-SOURCE LEAGUE STANDINGS */

.standings-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: end;
  margin: 20px 0;
}

.standings-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.standings-field label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.standings-updated {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin: 15px 0;
}

.standings-scroll {
  overflow-x: auto;
  border: 1px solid var(--yellow-border);
  border-radius: var(--radius);
  background: var(--yellow);
}

.standings-table {
  width: 100%;
  min-width: 740px;
  border-collapse: collapse;
}

.standings-table th {
  background: #f5d85c;
  padding: 15px 9px;
  font-size: 11px;
  text-align: center;
}

.standings-table th:nth-child(2) {
  text-align: left;
}

.standings-table td {
  border-top: 1px solid #d9be4b;
  padding: 11px 9px;
  font-size: 13px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.standings-table td:nth-child(2) {
  text-align: left;
}

.standings-club {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 180px;
}

.standings-club img {
  width: 28px;
  height: 28px;
  object-fit: contain;
}

.standings-points {
  font-weight: 800;
  font-size: 16px !important;
}

.standings-source {
  color: var(--muted);
  font-size: 11px;
  margin-top: 14px;
}

/* FOOTER */

.footer {
  margin-top: 40px;
  padding: 35px 0 45px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

.footer .wrap {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

/* RESPONSIVE */

@media (max-width: 1100px) {
  .edition { display: none; }
  .links { gap: 15px; }
}

@media (max-width: 900px) {
  .football-list { grid-template-columns: 1fr; }
  .nominee-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}

@media (max-width: 800px) {
  .wrap {
    width: min(100% - 36px,1200px);
  }

  .nav {
    min-height: 72px;
  }

  .links {
    display: none;
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    padding: 20px 24px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    flex-direction: column;
    align-items: start;
    gap: 10px;
  }

  .links.open { display: flex; }
  .menu { display: block; }

  .hero {
    grid-template-columns: 1fr;
    padding: 58px 0;
  }

  .hero h1 {
    letter-spacing: -3px;
  }

  .heroart {
    min-height: 320px;
  }

  .ball {
    max-width: 235px;
  }

  .feature-grid {
    grid-template-columns: 1fr;
  }

  .feature-card {
    min-height: 205px;
  }

  .section {
    padding: 42px 0 60px;
  }

  .sectionhead {
    align-items: start;
    flex-direction: column;
  }
}

@media (max-width: 600px) {
  .nominee-grid,
  .method-grid {
    grid-template-columns: 1fr;
  }

  .football-controls .control {
    min-width: 0;
    width: 100%;
  }

  .football-match {
    padding: 15px 12px;
  }

  .match-body {
    grid-template-columns: minmax(0,1fr) 36px 65px;
    gap: 7px;
  }

  .team-logo,
  .team-fallback {
    width: 28px;
    height: 28px;
  }

  .match-team {
    gap: 7px;
  }

  .team-name {
    font-size: 12px;
  }

  .match-score {
    font-size: 20px;
  }

  .match-status {
    padding-left: 5px;
    font-size: 9px;
  }

  .match-status-main {
    font-size: 10px;
  }

  .match-date {
    font-size: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}
</style>
</head>

  <nav class="nav wrap">

function footballDate(value) {
  if (!value) return "Date TBD";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "Date TBD";
  }

  return date.toLocaleString("en-GB", {
    timeZone: "UTC",
    day: "numeric",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }) + " UTC";
}

function footballUpdatedText(value) {
  if (!value) {
    return "Last database update: unavailable";
  }

  return `Last database update: ${footballDate(value)}`;
}

function footballCompetitionName(code) {
  return footballCompetitions.find(
    item => item[0] === code
  )?.[1] || code;
}

function footballTeamName(team) {
  return team?.short_name ||
    team?.name ||
    team?.tla ||
    "Team TBD";
}

function footballTeamInitials(team) {
  const name = footballTeamName(team);

  return (
    team?.tla ||
    name.split(/\s+/)
      .map(word => word[0])
      .join("")
      .slice(0,3)
  ).toUpperCase();
}


function footballTeamBadge(team) {
  const crest = String(team?.crest || "");

  const validCrest =
    /^https:\/\/crests\.football-data\.org\/[0-9]+\.(png|svg)$/i.test(crest);

  if (validCrest) {
    return `
      <img
        class="team-logo"
        src="${escapeHTML(crest)}"
        alt=""
        loading="lazy"
        referrerpolicy="no-referrer"
        onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='grid';"
      >
      <span
        class="team-fallback"
        style="display:none"
      >
        ${escapeHTML(footballTeamInitials(team))}
      </span>
    `;
  }

  return `
    <span class="team-fallback">
      ${escapeHTML(footballTeamInitials(team))}
    </span>
  `;
}


function footballMatchHTML(match) {
  const home = match.home_team || {};
  const away = match.away_team || {};

  const finished = match.status === "FINISHED";

  const homeScore = finished
    ? (match.home_goals ?? "–")
    : "–";

  const awayScore = finished
    ? (match.away_goals ?? "–")
    : "–";

  const matchday = match.matchday != null
    ? ` · MD ${escapeHTML(match.matchday)}`
    : "";

  const competitionName =
    footballCompetitionName(
      match.competition_code || footballCompetition
    );

  let statusText = "Scheduled";

  if (finished) {
    statusText = "Full time";
  } else if (match.status === "POSTPONED") {
    statusText = "Postponed";
  } else if (match.status === "TIMED") {
    statusText = "Upcoming";
  }

  return `
    <article class="card football-match">

      <div class="match-top">
        <span class="match-competition">
          ${escapeHTML(competitionName)}${matchday}
        </span>

        <span class="match-date">
          ${escapeHTML(footballDate(match.kickoff))}
        </span>
      </div>

      <div class="match-body">

        <div class="match-teams">

          <div class="match-team">
            ${footballTeamBadge(home)}
            <span class="team-name">
              ${escapeHTML(footballTeamName(home))}
            </span>
          </div>

          <div class="match-team">
            ${footballTeamBadge(away)}
            <span class="team-name">
              ${escapeHTML(footballTeamName(away))}
            </span>
          </div>

        </div>

        <div class="match-scores">
          <div class="match-score">
            ${escapeHTML(homeScore)}
          </div>

          <div class="match-score">
            ${escapeHTML(awayScore)}
          </div>
        </div>

        <div class="match-status">
          <span class="match-status-main">
            ${escapeHTML(statusText)}
          </span>
        </div>

      </div>

    </article>
  `;
}

let footballMatchdayAvailability = {
  results: [],
  fixtures: []
};

function allFootballMatchdays() {
  const seasonRecord = footballSeasons.find(
    item => Number(item.season) === footballSeason
  );

  if (!seasonRecord) return [];

  return [...new Set(
    seasonRecord.matchdays
      .map(Number)
      .filter(day => Number.isInteger(day) && day > 0)
  )].sort((a, b) => a - b);
}

function availableFootballMatchdays() {
  return footballMatchdayAvailability[footballType] || [];
}

/* ================================================
   FOOTBALL DATA — REFRESH MATCHDAY AVAILABILITY
================================================ */


function refreshFootballMatchdayAvailability() {
  // Matchday availability now comes directly from
  // the API's complete, status-based matchday data.

  ++footballRequestId;

  const seasonRecord = footballSeasons.find(
    item => Number(item.season) === footballSeason
  );

  const results = seasonRecord?.results_matchdays || [];
  const fixtures = seasonRecord?.fixtures_matchdays || [];

  footballMatchdayAvailability = {
    results: results
      .map(Number)
      .filter(Number.isInteger)
      .sort((a, b) => a - b),

    fixtures: fixtures
      .map(Number)
      .filter(Number.isInteger)
      .sort((a, b) => a - b)
  };

  footballDefaultMatchdays = {
    results:
      seasonRecord?.latest_result_matchday ?? null,

    fixtures:
      seasonRecord?.next_fixture_matchday ?? null
  };

  footballMatchday = null;

  selectDefaultFootballMatchday();
}

let footballDefaultMatchdays = {
  results: null,
  fixtures: null
};

/* ================================================
   FOOTBALL DATA — DEFAULT MATCHDAY
================================================ */

function selectDefaultFootballMatchday() {
  const matchdays = availableFootballMatchdays();

  const preferred = footballDefaultMatchdays[footballType];

  footballMatchday = matchdays.includes(preferred)
    ? preferred
    : footballType === "results"
      ? matchdays[matchdays.length - 1] ?? null
      : matchdays[0] ?? null;

  renderFootballMatchdayControls();

  if (footballMatchday === null) {
    ++footballRequestId;
    showFootballEmptyMessage();
    return;
  }

  loadFootballData();
}

function showFootballEmptyMessage() {
  const content = document.getElementById(
    "football-content"
  );

  if (!content) return;

  content.innerHTML = `
    <div class="football-message">
      ${footballType === "results"
        ? "No completed results are available for this season."
        : "No upcoming fixtures are available for this season."}
    </div>
  `;
}

        Next →
      </button>

    </div>
  `;

  document.getElementById(
    "football-season"
  )?.addEventListener("change", event => {
    footballSeason = Number(event.target.value);
    refreshFootballMatchdayAvailability();
  });

  document.getElementById(
    "football-matchday"
  )?.addEventListener("change", event => {
    const selected = Number(event.target.value);

    if (!matchdays.includes(selected)) return;

    footballMatchday = selected;
    renderFootballMatchdayControls();
    loadFootballData();
  });

  document.getElementById(
    "football-previous"
  )?.addEventListener("click", () => {
    if (previous === null) return;

    footballMatchday = previous;
    renderFootballMatchdayControls();
    loadFootballData();
  });

  document.getElementById(
    "football-next"
  )?.addEventListener("click", () => {
    if (next === null) return;

    footballMatchday = next;
    renderFootballMatchdayControls();
    loadFootballData();
  });
}

/* ================================================
   FOOTBALL DATA — LOAD SEASONS AND MATCHDAYS
================================================ */

async function loadFootballMatchdays() {
  const competition = footballCompetition;
  const requestId = ++footballRequestId;

  footballMatchdayAvailability = {
    results: [],
    fixtures: []
  };

  footballDefaultMatchdays = {
    results: null,
    fixtures: null
  };

  try {
    const params = new URLSearchParams({
      competition,
      type: "matchdays"
    });

    const response = await fetch(
      `/api/football?${params}`
    );

    if (!response.ok) {
      throw new Error(
        `Matchday API HTTP ${response.status}`
      );
    }

    const data = await response.json();

    if (
      requestId !== footballRequestId ||
      competition !== footballCompetition ||
      !document.getElementById("football-content")
    ) {
      return;
    }

    footballSeasons = Array.isArray(data.seasons)
      ? data.seasons
      : [];

    footballSeason = footballSeasons.length
      ? Number(footballSeasons[0].season)
      : null;

    footballMatchday = null;
    footballUpdatedAt = data.last_updated || null;

    refreshFootballMatchdayAvailability();

  } catch (error) {
    console.error(error);

    if (
      requestId !== footballRequestId ||
      competition !== footballCompetition
    ) {
      return;
    }

    footballSeasons = [];
    footballSeason = null;
    footballMatchday = null;

    footballMatchdayAvailability = {
      results: [],
      fixtures: []
    };

    renderFootballMatchdayControls();
    showFootballEmptyMessage();
  }
}

/* ================================================
   FOOTBALL DATA — FETCH MATCHES
================================================ */

async function loadFootballData() {
  const content = document.getElementById(
    "football-content"
  );

  if (!content) return;

  const requestId = ++footballRequestId;

  content.innerHTML = `
    <div class="football-message">
      Loading football data...
    </div>
  `;

  const params = new URLSearchParams({
    competition: footballCompetition,
    type: footballType,
    limit: footballMatchday !== null ? "100" : "20"
  });

  if (footballSeason !== null) {
    params.set("season", String(footballSeason));
  }

  if (footballMatchday !== null) {
    params.set("matchday", String(footballMatchday));
  }

  try {
    const response = await fetch(
      `/api/football?${params}`
    );

    if (!response.ok) {
      throw new Error(
        `Football API HTTP ${response.status}`
      );
    }

    const data = await response.json();

    if (
      requestId !== footballRequestId ||
      !document.getElementById("football-content")
    ) {
      return;
    }

    const updated = document.getElementById(
      "football-updated"
    );

    if (updated) {
      updated.textContent = footballUpdatedText(
        data.last_updated || footballUpdatedAt
      );
    }

    if (
      !Array.isArray(data.matches) ||
      data.matches.length === 0
    ) {
      content.innerHTML = `
        <div class="football-message">
          No ${footballType === "results"
            ? "completed results"
            : "upcoming fixtures"} available
          for this selection.
        </div>
      `;
      return;
    }

    content.innerHTML = `
      <div class="football-list">
        ${data.matches.map(footballMatchHTML).join("")}
      </div>
    `;

  } catch (error) {
    console.error(error);

    if (requestId !== footballRequestId) return;

    content.innerHTML = `
      <div class="football-message">
        Football data is temporarily unavailable.
        Please try again later.
      </div>
    `;
  }
}

/* ================================================
   FOOTBALL DATA — INITIALIZE PAGE
================================================ */

function initializeFootballPage() {
  const selector = document.getElementById(
    "football-competition"
  );

  if (!selector) return;

  selector.addEventListener("change", event => {
    footballCompetition = event.target.value;
    footballSeason = null;
    footballMatchday = null;
    footballSeasons = [];
    footballUpdatedAt = null;

    loadFootballMatchdays();
  });

  document.querySelectorAll(
    "[data-football-type]"
  ).forEach(button => {

    button.addEventListener("click", () => {
      footballType = button.dataset.footballType;

      document.querySelectorAll(
        "[data-football-type]"
      ).forEach(tab => {
        const active =
          tab.dataset.footballType === footballType;

        tab.classList.toggle("active", active);

        tab.setAttribute(
          "aria-pressed",
          String(active)
        );
      });

      selectDefaultFootballMatchday();
    });

  });

  loadFootballMatchdays();
}



/* ================================================
   OFFICIAL-SOURCE LEAGUE STANDINGS
================================================ */

const standingsCompetitions = [
  ["PL","Premier League"],
  ["PD","La Liga"],
  ["SA","Serie A"],
  ["BL1","Bundesliga"],
  ["FL1","Ligue 1"],
  ["PPL","Primeira Liga"]
];

let standingsCompetition = "PL";
let standingsSeason = null;
let standingsRequestId = 0;

function standingsPage() {
  return pagehead(
    "The league standings.",
    "The official-source tables",
    "League positions and statistics supplied by football-data.org, refreshed through the Ballon en Bois database."
  ) + `
    <section class="section wrap" style="padding-top:0">

      <div class="standings-toolbar">

        <div class="standings-field">
          <label for="standings-competition">
            Competition
          </label>

          <select
            id="standings-competition"
            class="control"
          >
            ${standingsCompetitions.map(([code,name]) => `
              <option
                value="${code}"
                ${code === standingsCompetition ? "selected" : ""}
              >
                ${escapeHTML(name)}
              </option>
            `).join("")}
          </select>
        </div>

        <div class="standings-field">
          <label for="standings-season">
            Season
          </label>

          <select
            id="standings-season"
            class="control"
          >
            <option value="">
              Latest available
            </option>
          </select>
        </div>

      </div>

      <div
        id="standings-updated"
        class="standings-updated"
      >
        Loading latest standings...
      </div>

      <div
        id="standings-content"
        aria-live="polite"
      >
        <div class="football-message">
          Loading league standings...
        </div>
      </div>

      <p class="standings-source">
        Data provided by football-data.org.
        League positions and statistics are supplied
        by the data provider and are not independently
        recalculated by Ballon en Bois.
      </p>

      <p class="notice">
        Tables reflect the most recent successful
        database import. They may differ from live
        matchday standings until the next refresh.
        Official league-specific ranking and
        tiebreaker rules are reflected only to the
        extent supported by the data provider.
      </p>

    </section>
  `;
}

function standingsSignedNumber(value) {
  const number = Number(value) || 0;

  return number > 0
    ? `+${number}`
    : String(number);
}

function standingsCrest(team) {
  const id = Number(team?.id);
  const crest = String(team?.crest || "");

  const validCrest =
    Number.isInteger(id) &&
    id > 0 &&
    /^https:\/\/crests\.football-data\.org\/[0-9]+\.(png|svg)$/i.test(crest);

  if (!validCrest) {
    return `
      <span class="team-fallback">
        ${escapeHTML(
          team?.tla ||
          (team?.short_name || team?.name || "?")
            .slice(0,3)
            .toUpperCase()
        )}
      </span>
    `;
  }

  return `
    <img
      src="${escapeHTML(crest)}"
      alt=""
      loading="lazy"
      referrerpolicy="no-referrer"
    >
  `;
}

function standingsTableHTML(data) {
  const rows = Array.isArray(data.standings)
    ? data.standings
    : [];

  if (!rows.length) {
    return `
      <div class="football-message">
        No standings are available for this
        competition and season.
      </div>
    `;
  }

  return `
    <div class="standings-scroll">

      <table class="standings-table">

        <thead>
          <tr>
            <th scope="col">Pos</th>
            <th scope="col">Club</th>
            <th scope="col">P</th>
            <th scope="col">W</th>
            <th scope="col">D</th>
            <th scope="col">L</th>
            <th scope="col">GF</th>
            <th scope="col">GA</th>
            <th scope="col">GD</th>
            <th scope="col">Pts</th>
          </tr>
        </thead>

        <tbody>

          ${rows.map(entry => {
            const team = entry.team || {};

            return `
              <tr>

                <td>
                  <strong>
                    ${escapeHTML(entry.position)}
                  </strong>
                </td>

                <td>
                  <div class="standings-club">

                    ${standingsCrest(team)}

                    <strong>
                      ${escapeHTML(
                        team.short_name ||
                        team.name ||
                        "Unknown club"
                      )}
                    </strong>

                  </div>
                </td>

                <td>${escapeHTML(entry.played_games)}</td>
                <td>${escapeHTML(entry.won)}</td>
                <td>${escapeHTML(entry.drawn)}</td>
                <td>${escapeHTML(entry.lost)}</td>
                <td>${escapeHTML(entry.goals_for)}</td>
                <td>${escapeHTML(entry.goals_against)}</td>

                <td>
                  ${escapeHTML(
                    standingsSignedNumber(
                      entry.goal_difference
                    )
                  )}
                </td>

                <td class="standings-points">
                  ${escapeHTML(entry.points)}
                </td>

              </tr>
            `;
          }).join("")}

        </tbody>

      </table>

    </div>
  `;
}

async function loadStandings() {
  const content = document.getElementById(
    "standings-content"
  );

  if (!content) return;

  const requestId = ++standingsRequestId;

  content.innerHTML = `
    <div class="football-message">
      Loading league standings...
    </div>
  `;

  const params = new URLSearchParams({
    competition: standingsCompetition,
    type: "standings"
  });

  if (standingsSeason !== null) {
    params.set(
      "season",
      String(standingsSeason)
    );
  }

  try {
    const response = await fetch(
      `/api/football?${params}`
    );

    if (!response.ok) {
      throw new Error(
        `Standings API HTTP ${response.status}`
      );
    }

    const data = await response.json();

    if (
      requestId !== standingsRequestId ||
      !document.getElementById("standings-content")
    ) {
      return;
    }

    const updated = document.getElementById(
      "standings-updated"
    );

    if (updated) {
      const seasonLabel = data.season
        ? `Season ${data.season}–${String(
            data.season + 1
          ).slice(-2)} · `
        : "";

      updated.textContent =
        seasonLabel +
        footballUpdatedText(data.last_updated);
    }

    const seasonSelect = document.getElementById(
      "standings-season"
    );

    if (seasonSelect) {
      const availableYear = data.season;

      seasonSelect.innerHTML = `
        <option value="">
          Latest available
        </option>

        ${availableYear ? `
          <option
            value="${availableYear}"
            ${standingsSeason === availableYear
              ? "selected"
              : ""}
          >
            ${availableYear}–${String(
              availableYear + 1
            ).slice(-2)}
          </option>
        ` : ""}
      `;
    }

    content.innerHTML = standingsTableHTML(data);

  } catch (error) {
    console.error(error);

    if (requestId !== standingsRequestId) return;

    content.innerHTML = `
      <div class="football-message">
        League standings are temporarily
        unavailable. Please try again later.
      </div>
    `;
  }
}

function initializeStandingsPage() {
  const selector = document.getElementById(
    "standings-competition"
  );

  if (!selector) return;

  selector.addEventListener("change", event => {
    standingsCompetition = event.target.value;
    standingsSeason = null;
    loadStandings();
  });

  document.getElementById(
    "standings-season"
  )?.addEventListener("change", event => {
    standingsSeason = event.target.value
      ? Number(event.target.value)
      : null;

    loadStandings();
  });

  loadStandings();
}

/* ================================================
   FILTER CONTROLS
================================================ */

function initializeFilters(route) {
  const league = document.getElementById("league");
  const category = document.getElementById("category");
  const search = document.getElementById("search");
  const sortControl = document.getElementById("sort");

  if (league) {
    league.addEventListener("change", event => {
      filters.league = event.target.value;
      drawResults(route);
    });
  }

  if (category) {
    category.addEventListener("change", event => {
      filters.category = event.target.value;
      drawResults(route);
    });
  }

  if (search) {
    search.addEventListener("input", event => {
      filters.search = event.target.value;
      drawResults(route);
    });
  }

  if (sortControl) {
    sortControl.value = sort;

    sortControl.addEventListener("change", event => {
      sort = event.target.value;
      drawResults(route);
    });
  }

  drawResults(route);
}

/* ================================================
   ROUTER AND NAVIGATION
================================================ */

const pages = {
  home,
  nominees,
  rankings,
  football: footballPage,
  standings: standingsPage,
  methodology
};

function currentRoute() {
  const hash = window.location.hash
    .replace(/^#\/?/, "")
    .split(/[/?]/)[0];

  return pages[hash] ? hash : "home";
}

function render() {
  const route = currentRoute();
  const app = document.getElementById("app");

  if (!app) return;

  /*
    Invalidate pending API requests whenever
    the visitor changes pages.
  */

  footballRequestId++;
  standingsRequestId++;

  app.innerHTML = pages[route]();

  document.querySelectorAll(
    "[data-route]"
  ).forEach(link => {
    link.classList.toggle(
      "active",
      link.dataset.route === route
    );
  });

  const links = document.getElementById("links");
  const menu = document.getElementById("menu");

  if (links) {
    links.classList.remove("open");
  }

  if (menu) {
    menu.setAttribute(
      "aria-expanded",
      "false"
    );
  }

  if (route === "nominees" || route === "rankings") {
    initializeFilters(route);
  }

  if (route === "football") {
    initializeFootballPage();
  }

  if (route === "standings") {
    initializeStandingsPage();
  }

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });
}

document.getElementById("menu")
  ?.addEventListener("click", () => {
    const links = document.getElementById("links");
    const menu = document.getElementById("menu");

    if (!links || !menu) return;

    const open = links.classList.toggle("open");

    menu.setAttribute(
      "aria-expanded",
      String(open)
    );
  });

window.addEventListener("hashchange", render);

render();

</script>
