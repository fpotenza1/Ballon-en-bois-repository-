
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Ballon en Bois — Football's Reality Awards. Satirical football awards, rankings, results and fixtures.">
<title>Ballon en Bois — Football's Reality Awards</title>

<style>
/* ================================================
   BALLON EN BOIS — UNIFIED DESIGN SYSTEM
   White background · Yellow cards · Black text
================================================ */

:root {
  --white: #ffffff;
  --black: #191a17;
  --yellow: #ffe56b;
  --yellow-light: #fff0a6;
  --yellow-border: #e8cb4d;
  --wood: #916e50;
  --muted: #6e6e68;
  --border: #e7e7e3;
  --radius: 12px;
  --shadow: 0 5px 18px rgba(0,0,0,.035);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--white);
  color: var(--black);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid var(--wood);
  outline-offset: 3px;
}

.wrap {
  width: min(1200px, calc(100% - 64px));
  margin-inline: auto;
}

/* HEADER */

.top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}

.nav {
  min-height: 84px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.mark {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border: 2px solid var(--black);
  border-radius: 50%;
  font: 26px Georgia, serif;
  color: var(--wood);
}

.brandname {
  display: block;
  font: bold 23px Georgia, serif;
  letter-spacing: -.8px;
}

.brand small {
  display: block;
  margin-top: 4px;
  color: var(--wood);
  font-size: 8px;
  letter-spacing: 2.5px;
}

.links {
  display: flex;
  align-items: center;
  gap: 22px;
}

.links a {
  position: relative;
  padding: 12px 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.1px;
  text-transform: uppercase;
}

.links a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 5px;
  height: 3px;
  background: transparent;
  border-radius: 2px;
}

.links a.active::after,
.links a:hover::after {
  background: var(--yellow);
}

.edition {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
  white-space: nowrap;
}

.menu {
  display: none;
  border: 0;
  background: transparent;
  color: var(--black);
  font-size: 25px;
}

/* SHARED TYPOGRAPHY */

.eyebrow {
  color: var(--wood);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.pagehead {
  padding: 76px 0 46px;
}

.pagehead h1 {
  margin: 16px 0 20px;
  font: normal clamp(44px, 6vw, 74px)/1.04 Georgia, serif;
  letter-spacing: -2.5px;
}

.sub {
  max-width: 720px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.75;
}

.section {
  padding: 55px 0 80px;
}

.sectionhead {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 25px;
  margin-bottom: 26px;
}

.sectionhead h2 {
  margin: 12px 0;
  font: normal clamp(34px, 4.5vw, 55px)/1.1 Georgia, serif;
  letter-spacing: -1.8px;
}

.sectionhead .sub {
  max-width: 420px;
}

.textlink {
  padding-bottom: 6px;
  border-bottom: 2px solid var(--yellow-border);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  white-space: nowrap;
}

/* SHARED YELLOW CARDS */

.card {
  background: var(--yellow);
  color: var(--black);
  border: 1px solid var(--yellow-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.card:hover {
  border-color: #c6a930;
}

.card-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}

.card-title {
  margin: 15px 0;
  font: normal 30px/1.12 Georgia, serif;
}

.card-text {
  color: #484332;
  font-size: 13px;
  line-height: 1.65;
}

/* SHARED BUTTONS */

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  padding: 13px 20px;
  border: 1px solid var(--black);
  border-radius: 7px;
  background: var(--black);
  color: var(--white);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: background .15s, color .15s;
}

.btn:hover {
  background: #383a33;
}

.btn-yellow {
  background: var(--yellow);
  color: var(--black);
  border-color: var(--yellow-border);
}

.btn-yellow:hover {
  background: var(--yellow-light);
}

.btn-outline {
  background: var(--white);
  color: var(--black);
}

.btn-outline:hover {
  background: var(--yellow);
}

/* HOME PAGE */

.hero {
  display: grid;
  grid-template-columns: 1.12fr .88fr;
  align-items: center;
  gap: 35px;
  padding: 92px 0 85px;
}

.hero h1 {
  margin: 25px 0;
  font: normal clamp(65px, 8vw, 120px)/.94 Georgia, serif;
  letter-spacing: -5px;
}

.hero h1 em {
  font-style: normal;
  color: var(--wood);
}

.lead {
  margin: 0 0 25px;
  font: normal clamp(21px, 2.5vw, 30px)/1.35 Georgia, serif;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 30px;
}

.heroart {
  position: relative;
  min-height: 430px;
  display: grid;
  place-items: center;
  background: var(--yellow);
  border: 1px solid var(--yellow-border);
  border-radius: 20px;
  overflow: hidden;
}

.heroart::before {
  content: "";
  position: absolute;
  width: 82%;
  aspect-ratio: 1;
  border: 1px solid #c9aa3d;
  border-radius: 50%;
}

.heroart::after {
  content: "THE WOODEN BALL · 2026";
  position: absolute;
  bottom: 23px;
  color: #655529;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
}

.ball {
  position: relative;
  z-index: 1;
  width: min(310px, 78%);
  filter: drop-shadow(16px 21px 15px #0002);
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 18px;
}

.feature-card {
  min-height: 245px;
  padding: 27px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.feature-card h3 {
  margin: 0 0 12px;
  font: normal 31px Georgia, serif;
}

.feature-card p {
  margin: 0;
}

.feature-arrow {
  align-self: end;
  font-size: 23px;
}

.league-strip {
  padding: 28px 0;
  border-block: 1px solid var(--border);
}

.league-strip .wrap {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px;
}

.league-strip span {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* SHARED FILTERS */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 26px 0;
}

.control {
  min-width: 180px;
  min-height: 47px;
  padding: 12px 15px;
  border: 1px solid var(--yellow-border);
  border-radius: 7px;
  background: var(--yellow);
  color: var(--black);
  font-size: 13px;
}

.control::placeholder {
  color: #635d45;
}

.search {
  flex: 1;
  min-width: 210px;
}

/* NOMINEES */

.nominee-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 17px;
}

.nominee-card {
  min-height: 300px;
  padding: 27px;
  display: flex;
  flex-direction: column;
}

.nominee-card h3 {
  margin: 24px 0 7px;
  font: normal 31px Georgia, serif;
}

.nominee-club {
  font-size: 13px;
  color: #514b37;
}

.nominee-description {
  margin: 20px 0;
  color: #514b37;
  font-size: 13px;
  line-height: 1.65;
}

.nominee-bottom {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 15px;
  margin-top: auto;
  padding-top: 17px;
  border-top: 1px solid #d4b944;
}

.nominee-bottom span {
  font-size: 11px;
}

.nominee-bottom strong {
  font: normal 35px Georgia, serif;
}

/* RANKINGS */

.ranking-table {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 1px solid var(--yellow-border);
  background: var(--yellow);
}

.ranking-table table {
  width: 100%;
  min-width: 650px;
  border-collapse: collapse;
  text-align: left;
}

.ranking-table th {
  padding: 20px;
  background: #f5d85c;
  font-size: 10px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
}

.ranking-table td {
  padding: 20px;
  border-top: 1px solid #d9be4b;
  font-size: 13px;
}

.ranking-table td:first-child {
  font: normal 26px Georgia, serif;
}

.ranking-table td strong {
  font-size: 15px;
}

.ranking-table td small {
  display: block;
  margin-top: 6px;
  color: #61583b;
}

.ranking-score {
  font-size: 22px !important;
  font-weight: 700;
}

/* METHODOLOGY */

.method-grid {

  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 18px;
}

.method-card {
  padding: 30px;
  min-height: 205px;
}

.method-weight {
  font: normal 48px Georgia, serif;
}

.method-card h3 {
  margin: 15px 0 10px;
  font: normal 25px Georgia, serif;
}

.method-card p {
  color: #514b37;
  font-size: 13px;
  line-height: 1.65;
}

/* NOTICES */

.notice {
  margin: 25px 0;
  padding: 19px 22px;
  border: 1px solid var(--yellow-border);
  border-radius: var(--radius);
  background: var(--yellow-light);
  color: #4d4530;
  font-size: 13px;
  line-height: 1.65;
}

.empty {
  padding: 35px;
  text-align: center;
  border: 1px solid var(--yellow-border);
  border-radius: var(--radius);
  background: var(--yellow-light);
  color: var(--black);
}

/* FOOTBALL DATA */

.football-controls {
  margin: 24px 0 19px;
}

.football-controls .control {
  min-width: 320px;
}

.football-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 23px;
}

.football-tab {
  min-height: 46px;
  padding: 13px 20px;
  border: 1px solid var(--yellow-border);
  border-radius: 7px;
  background: var(--yellow);
  color: var(--black);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.football-tab.active {
  background: var(--black);
  color: var(--white);
  border-color: var(--black);
}

.football-tab:not(.active):hover {
  background: var(--yellow-light);
}

.football-list {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 16px;
}

.football-match {
  min-width: 0;
  padding: 19px 21px 16px;
}

.match-top {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 12px;
  margin-bottom: 18px;
}

.match-competition {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.match-date {
  color: #504a34;
  font-size: 11px;
  text-align: right;
  white-space: nowrap;
}

.match-body {
  display: grid;
  grid-template-columns: minmax(0,1fr) 45px 82px;
  gap: 12px;
  align-items: center;
}

.match-teams,
.match-scores {
  display: grid;
  grid-template-rows: repeat(2,minmax(38px,auto));
  row-gap: 8px;
}

.match-team {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.team-name {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.team-logo {
  width: 34px;
  height: 34px;
  flex: none;
  object-fit: contain;
}

.team-fallback {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid #b69a37;
  border-radius: 50%;
  background: #fff8d4;
  color: var(--black);
  font-size: 10px;
  font-weight: 700;
}

.match-score {
  display: grid;
  place-items: center;
  font: bold 23px Georgia, serif;
}

.match-status {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding-left: 9px;
  border-left: 1px solid #d1b542;
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
}

.match-status-main {
  font-size: 12px;
}

.match-events {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 15px;
  padding-top: 12px;
  border-top: 1px solid #d1b542;
}

.match-events-side {
  font-size: 11px;
  line-height: 1.6;
}

.match-events-side:last-child {
  text-align: right;
}

.scorer-line {
  margin: 3px 0;
}

.football-message {
  grid-column: 1/-1;
  padding: 35px;
  border: 1px solid var(--yellow-border);
  border-radius: var(--radius);
  background: var(--yellow-light);
  text-align: center;
  font-size: 14px;
}

/* FOOTBALL NAVIGATION AND FRESHNESS */

.football-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 4px 0 22px;
}

.football-updated {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.football-matchday-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  margin: 0 0 20px;
}

.football-matchday-nav .control {
  min-width: 120px;
}

.football-matchday-nav .btn {
  min-height: 45px;
  padding: 11px 15px;
}

.football-matchday-nav .btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

/* FOOTER */

.footer {
  margin-top: 40px;
  padding: 35px 0 45px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

.footer .wrap {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

@media (max-width: 1100px) {
  .edition { display: none; }
  .links { gap: 15px; }
}

@media (max-width: 900px) {
  .football-list { grid-template-columns: 1fr; }
  .nominee-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}

@media (max-width: 800px) {
  .wrap {
    width: min(100% - 36px,1200px);
  }

  .nav {
    min-height: 72px;
  }

  .links {
    display: none;
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    padding: 20px 24px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    flex-direction: column;
    align-items: start;
    gap: 10px;
  }

  .links.open { display: flex; }
  .menu { display: block; }

  .hero {
    grid-template-columns: 1fr;
    padding: 58px 0;
  }

  .hero h1 {
    letter-spacing: -3px;
  }

  .heroart {
    min-height: 320px;
  }

  .ball {
    max-width: 235px;
  }

  .feature-grid {
    grid-template-columns: 1fr;
  }

  .feature-card {
    min-height: 205px;
  }

  .section {
    padding: 42px 0 60px;
  }

  .sectionhead {
    align-items: start;
    flex-direction: column;
  }
}

@media (max-width: 600px) {
  .nominee-grid,
  .method-grid {
    grid-template-columns: 1fr;
  }

  .football-controls .control {
    min-width: 0;
    width: 100%;
  }

  .football-match {
    padding: 15px 12px;
  }

  .match-body {
    grid-template-columns: minmax(0,1fr) 36px 65px;
    gap: 7px;
  }

  .team-logo,
  .team-fallback {
    width: 28px;
    height: 28px;
  }

  .match-team {
    gap: 7px;
  }

  .team-name {
    font-size: 12px;
  }

  .match-score {
    font-size: 20px;
  }

  .match-status {
    padding-left: 5px;
    font-size: 9px;
  }

  .match-status-main {
    font-size: 10px;
  }

  .match-date {
    font-size: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}
</style>
</head>

function footballDate(value) {
  if (!value) return "Date unavailable";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "Date unavailable";
  }

  return new Intl.DateTimeFormat("en-US",{
    month:"short",
    day:"numeric",
    year:"numeric",
    timeZone:"UTC"
  }).format(date);
}

function footballTime(value) {
  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return new Intl.DateTimeFormat("en-GB",{
    hour:"2-digit",
    minute:"2-digit",
    timeZone:"UTC"
  }).format(date) + " UTC";
}

function teamBadge(team) {
  const name = team?.short_name || team?.name || "TBD";
  const crest = team?.crest || team?.crest_url || null;

  const initials = String(
    team?.tla || name.slice(0,3)
  ).slice(0,3);

  if (
    typeof crest === "string" &&
    /^https:\/\//i.test(crest)
  ) {
    return `
      <img
        class="team-logo"
        src="${escapeHTML(crest)}"
        alt="${escapeHTML(name)} crest"
        loading="lazy"
        referrerpolicy="no-referrer"
        onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"
      >

      <span class="team-fallback" style="display:none">
        ${escapeHTML(initials)}
      </span>
    `;
  }

  return `
    <span class="team-fallback">
      ${escapeHTML(initials)}
    </span>
  `;
}

function scorerEvents(match,side) {
  const events = Array.isArray(match.events)
    ? match.events
    : Array.isArray(match.scorers)
      ? match.scorers
      : [];

  return events.filter(event => {
    const kind = String(
      event.type || event.event_type || "GOAL"
    ).toUpperCase();

    const team = String(
      event.team || event.side || ""
    ).toLowerCase();

    return (
      ["GOAL","PENALTY","OWN_GOAL"].includes(kind) &&
      team === side &&
      (event.player || event.player_name)
    );
  });
}

function scorerHTML(events) {
  return events.map(event => {
    const player = escapeHTML(
      event.player || event.player_name
    );

    const minute = event.minute != null
      ? `${escapeHTML(event.minute)}'`
      : "";

    return `
      <div class="scorer-line">
        ⚽ ${player} ${minute}
      </div>
    `;
  }).join("");
}

function footballMatchHTML(match) {

  return `

function footballUpdateLabel(value) {

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "Last updated: unavailable";
  return "Last updated: " + new Intl.DateTimeFormat("en-US", {
    year: "numeric", month: "long", day: "numeric",

}

function renderFootballNavigation() {
  const seasonSelect = document.getElementById("football-season");
  const daySelect = document.getElementById("football-matchday");
  const previous = document.getElementById("football-previous");
  const next = document.getElementById("football-next");
  if (!seasonSelect || !daySelect || !previous || !next) return;

  const selectedSeason = footballSeasons.find(item => item.season === footballSeason);
  const days = selectedSeason ? [...selectedSeason.matchdays].sort((a,b) => a-b) : [];

  seasonSelect.innerHTML = footballSeasons.length
    ? footballSeasons.map(item => `<option value="${item.season}" ${item.season === footballSeason ? "selected" : ""}>Season ${item.season}</option>`).join("")
    : `<option value="">No seasons available</option>`;
  seasonSelect.disabled = !footballSeasons.length;

  daySelect.innerHTML = `<option value="">All matchdays</option>` +
    days.map(day => `<option value="${day}" ${day === footballMatchday ? "selected" : ""}>Matchday ${day}</option>`).join("");
  daySelect.disabled = !days.length;

  const index = days.indexOf(footballMatchday);
  previous.disabled = !days.length || (index === 0);
  next.disabled = !days.length || (index === days.length - 1);
  // When viewing all matchdays, either arrow starts at the relevant end.
  if (index === -1 && days.length) {
    previous.disabled = false;
    next.disabled = false;
  }
}

function setFootballUpdated(value) {
  footballUpdatedAt = value || null;
  const element = document.getElementById("football-updated");
  if (element) {
    element.textContent = footballUpdateLabel(footballUpdatedAt);
    element.title = footballUpdatedAt || "No database update timestamp available";
  }
}

async function loadFootballData(resetMatchday = false) {
  const content = document.getElementById("football-content");
  if (!content) return;
  const requestId = ++footballRequestId;
  content.innerHTML = `<div class="football-message">Loading football data...</div>`;

  try {
    if (resetMatchday || !footballSeasons.length) {
      const [metadataResponse, previewResponse] = await Promise.all([
        fetch(`/api/football?${new URLSearchParams({competition:footballCompetition,type:"matchdays"})}`),
        fetch(`/api/football?${new URLSearchParams({competition:footballCompetition,type:footballType,limit:"20"})}`)
      ]);
      if (!metadataResponse.ok || !previewResponse.ok) throw new Error("Unable to load football navigation");
      const [metadata, preview] = await Promise.all([metadataResponse.json(), previewResponse.json()]);
      if (requestId !== footballRequestId || !document.getElementById("football-content")) return;

      footballSeasons = Array.isArray(metadata.seasons) ? metadata.seasons : [];
      const firstMatch = Array.isArray(preview.matches) ? preview.matches[0] : null;
      const preferredSeason = firstMatch?.season_start;
      footballSeason = footballSeasons.some(item => item.season === preferredSeason)
        ? preferredSeason : (footballSeasons[0]?.season ?? null);
      const selected = footballSeasons.find(item => item.season === footballSeason);
      footballMatchday = selected?.matchdays.includes(firstMatch?.matchday)
        ? firstMatch.matchday : null;
      setFootballUpdated(metadata.last_updated || preview.last_updated);
      renderFootballNavigation();
    }

    const params = new URLSearchParams({
      competition:footballCompetition,
      type:footballType,
      limit:footballMatchday === null ? "20" : "100"
    });
    if (footballSeason !== null) params.set("season",String(footballSeason));
    if (footballMatchday !== null) params.set("matchday",String(footballMatchday));

    const response = await fetch(`/api/football?${params}`);
    if (!response.ok) throw new Error(`Football API returned HTTP ${response.status}`);
    const data = await response.json();
    if (requestId !== footballRequestId || !document.getElementById("football-content")) return;

    setFootballUpdated(data.last_updated || footballUpdatedAt);
    renderFootballNavigation();
    if (!Array.isArray(data.matches) || !data.matches.length) {
      content.innerHTML = `<div class="football-message">No ${footballType === "results" ? "completed results" : "upcoming fixtures"} are currently available for this selection.</div>`;
      return;
    }
    content.innerHTML = `<div class="football-list">${data.matches.map(footballMatchHTML).join("")}</div>`;
  } catch (error) {
    if (requestId !== footballRequestId) return;
    console.error("[Football Data]",error);
    content.innerHTML = `<div class="football-message">Football data is temporarily unavailable. Please try again later.</div>`;
    const updated = document.getElementById("football-updated");
    if (updated && !footballUpdatedAt) updated.textContent = "Last updated: unavailable";
  }
}

function initializeFootballPage() {
  const selector = document.getElementById("football-competition");
  if (!selector) return;

  selector.addEventListener("change", event => {
    footballCompetition = event.target.value;
    footballSeason = null;
    footballMatchday = null;
    footballSeasons = [];
    footballUpdatedAt = null;
    loadFootballData(true);
  });

  document.querySelectorAll("[data-football-type]").forEach(button => {
    button.addEventListener("click", () => {
      footballType = button.dataset.footballType;
      document.querySelectorAll("[data-football-type]").forEach(tab => {
        const active = tab.dataset.footballType === footballType;
        tab.classList.toggle("active",active);
        tab.setAttribute("aria-pressed",String(active));
      });
      loadFootballData(true);
    });
  });

  document.getElementById("football-season").addEventListener("change", event => {
    footballSeason = Number(event.target.value);
    footballMatchday = null;
    renderFootballNavigation();
    loadFootballData();
  });

  document.getElementById("football-matchday").addEventListener("change", event => {
    footballMatchday = event.target.value === "" ? null : Number(event.target.value);
    renderFootballNavigation();
    loadFootballData();
  });

  function moveMatchday(direction) {
    const days = [...(footballSeasons.find(item => item.season === footballSeason)?.matchdays || [])].sort((a,b) => a-b);
    if (!days.length) return;
    const index = days.indexOf(footballMatchday);
    const nextIndex = index === -1 ? (direction < 0 ? days.length - 1 : 0) : index + direction;
    if (nextIndex < 0 || nextIndex >= days.length) return;
    footballMatchday = days[nextIndex];
    renderFootballNavigation();
    loadFootballData();
  }

  document.getElementById("football-previous").addEventListener("click", () => moveMatchday(-1));
  document.getElementById("football-next").addEventListener("click", () => moveMatchday(1));
  loadFootballData(true);
}

/* ================================================
   NAVIGATION AND RENDERING
================================================ */

function render() {
  let route =
    location.hash.replace("#/","").split("?")[0] ||
    "home";

  const pages = {
    home,
    nominees,
    rankings,
    football:footballPage,
    methodology
  };

  if (!pages[route]) {
    route = "home";
  }

  document.getElementById("app").innerHTML =
    pages[route]();

  document
    .querySelectorAll("[data-route]")
    .forEach(link => {
      link.classList.toggle(
        "active",
        link.dataset.route === route
      );
    });

  const links = document.getElementById("links");
  const menu = document.getElementById("menu");

  links.classList.remove("open");
  menu.setAttribute("aria-expanded","false");

  if (
    route === "nominees" ||
    route === "rankings"
  ) {
    drawResults(route);

    ["league","category","search"].forEach(id => {
      document.getElementById(id).addEventListener(
        id === "search" ? "input" : "change",
        event => {
          filters[id] = event.target.value;
          drawResults(route);
        }
      );
    });

    if (route === "rankings") {
      const sortSelector = document.getElementById(
        "sort"
      );

      sortSelector.value = sort;

      sortSelector.addEventListener(
        "change",
        event => {
          sort = event.target.value;
          drawResults(route);
        }
      );
    }
  }

  if (route === "football") {
    initializeFootballPage();
  }

  window.scrollTo(0,0);
}

document.getElementById("menu").onclick = () => {
  const links = document.getElementById("links");
  const isOpen = links.classList.toggle("open");

  document.getElementById("menu").setAttribute(
    "aria-expanded",
    String(isOpen)
  );
};

window.addEventListener("hashchange",render);

render();
</script>
