<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f6"><meta name="description" content="Ballon en Bois — the independent football awards for expectations unmet. Explore nominees and rankings across six European leagues."><title>Ballon en Bois — The Art of Disappointment</title><style>
:root{--paper:#faf9f6;--ink:#191a17;--muted:#77776f;--line:#deddd7;--wood:#916e50;--light:#f0eee8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,select,input{font:inherit}button{cursor:pointer}.wrap{width:min(1200px,calc(100% - 72px));margin:auto}.top{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:10}.nav{height:82px;display:flex;align-items:center;justify-content:space-between;gap:22px}.brand{display:flex;gap:12px;align-items:center}.mark{width:35px;height:35px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:22px;font-family:Georgia,serif;color:var(--wood)}.brandname{font-family:Georgia,serif;letter-spacing:-.6px;font-weight:bold;font-size:22px}.brand small{display:block;font-size:8px;letter-spacing:2.4px;color:var(--wood);margin-top:3px}.links{display:flex;gap:34px;align-items:center}.links a{font-size:11px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;padding:12px 0}.links a.active{border-bottom:2px solid var(--wood)}.right{font-size:11px;letter-spacing:1px;color:var(--muted)}.menu{display:none;border:0;background:transparent;font-size:23px}.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--wood);font-weight:bold}.hero{padding:102px 0 88px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:30px}.hero h1{font:normal clamp(64px,8vw,126px)/.94 Georgia,'Times New Roman',serif;letter-spacing:-6px;margin:25px 0 25px}.hero h1 em{font-style:normal;color:var(--wood)}.lead{font:normal clamp(20px,2.4vw,30px)/1.35 Georgia,serif;max-width:500px;margin:0 0 35px}.btn{display:inline-block;background:var(--ink);color:white;border:1px solid var(--ink);padding:16px 24px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:bold}.btn:hover{background:var(--wood);border-color:var(--wood)}.btn.outline{background:transparent;color:var(--ink)}.btn.outline:hover{color:white;background:var(--ink)}.heroart{min-height:450px;display:grid;place-items:center;position:relative}.heroart:before{content:'';width:76%;aspect-ratio:1;border:1px solid #d7d1c7;border-radius:50%;position:absolute}.heroart:after{content:'EST. 2026';position:absolute;bottom:2%;font-size:10px;letter-spacing:4px;color:var(--muted)}.ball{width:min(330px,75%);filter:drop-shadow(18px 25px 17px #0002)}.section{padding:78px 0}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:32px}.section h2,.pagehead h1{font:normal clamp(38px,5vw,64px)/1.06 Georgia,serif;letter-spacing:-2px;margin:10px 0}.sub{color:var(--muted);line-height:1.7;max-width:680px;font-size:15px}.textlink{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:6px;font-weight:bold;white-space:nowrap}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tile{border:1px solid var(--line);padding:30px;min-height:245px;display:flex;flex-direction:column;justify-content:space-between;background:#fff}.tile:hover{border-color:var(--wood)}.tile .num{font:normal 14px Georgia,serif;color:var(--wood)}.tile h3{font:normal 32px/1.1 Georgia,serif;margin:0 0 13px}.tile p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}.tile .arr{font-size:22px;align-self:end}.strip{background:var(--light);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0}.strip .wrap{display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap}.strip span{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;font-weight:bold}.pagehead{padding:75px 0 40px;border-bottom:1px solid var(--line)}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}.control{padding:13px 16px;border:1px solid var(--line);background:#fff;color:var(--ink);min-width:180px}.search{flex:1;min-width:210px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.nominee{border:1px solid var(--line);padding:26px;background:#fff}.nominee .meta{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--wood)}.nominee h3{font:normal 30px Georgia,serif;margin:25px 0 6px}.nominee .club{color:var(--muted);font-size:13px}.nominee .score{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:30px;padding-top:17px;font-size:12px}.nominee .score b{font:normal 28px Georgia,serif;color:var(--wood)}.tablewrap{overflow-x:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;text-align:left;min-width:660px}th{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);background:#f4f3ee;padding:18px 20px}td{padding:22px 20px;border-top:1px solid var(--line);font-size:14px}td:first-child{font:normal 25px Georgia,serif;color:var(--wood)}td strong{font-size:15px}td small{display:block;color:var(--muted);margin-top:5px}.scorepill{font-weight:bold;color:var(--wood)}.note{border-left:2px solid var(--wood);padding:12px 18px;color:var(--muted);font-size:13px;line-height:1.6;margin:28px 0}.empty{padding:40px;text-align:center;color:var(--muted);border:1px solid var(--line)}.footer{border-top:1px solid var(--line);padding:38px 0 45px;color:var(--muted);font-size:12px}.footer .wrap{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.hide{display:none!important}@media(max-width:800px){.wrap{width:min(100% - 36px,1200px)}.nav{height:70px}.links{display:none;position:absolute;top:70px;left:0;right:0;background:var(--paper);padding:20px 24px;border-bottom:1px solid var(--line);flex-direction:column;align-items:start;gap:10px}.links.open{display:flex}.menu{display:block}.right{display:none}.hero{grid-template-columns:1fr;padding:65px 0 45px}.hero h1{letter-spacing:-3px}.heroart{min-height:300px}.ball{max-width:240px}.three,.grid{grid-template-columns:1fr}.section{padding:55px 0}.sectionhead{align-items:start;flex-direction:column}.tile{min-height:205px}}
</style></head><body><header class="top"><nav class="nav wrap"><a class="brand" href="#/"><span class="mark">✳</span><span><span class="brandname">BALLON EN BOIS</span><small>FOOTBALL'S REALITY AWARDS</small></span></a><div class="links" id="links"><a href="#/" data-route="home">Home</a><a href="#/nominees" data-route="nominees">Nominees</a><a href="#/rankings" data-route="rankings">Rankings</a><a href="#/methodology" data-route="methodology">Methodology</a></div><span class="right">THE 2026 EDITION · EN</span><button class="menu" aria-label="Toggle navigation" id="menu">☰</button></nav></header><main id="app"></main><footer class="footer"><div class="wrap"><span>© 2026 BALLON EN BOIS. AN INDEPENDENT SATIRICAL FOOTBALL PROJECT.</span><span>EXCELLENCE WAS EXPECTED. DISAPPOINTMENT DELIVERED.</span></div></footer><script>
// Illustrative fictional profiles only. Replace with researched, sourced real nominees before launch.
const players=[{name:'Alex Mercer',club:'Northbridge FC',league:'Premier League',role:'Forward',score:91,category:'Player',reason:'Illustrative profile — season output below preseason expectations.'},{name:'Marco Bellini',club:'AC Portovale',league:'Serie A',role:'Midfielder',score:87,category:'Transfer',reason:'Illustrative profile — high transfer expectations versus contribution.'},{name:'Hugo Valdés',club:'Real Monteverde',league:'La Liga',role:'Forward',score:84,category:'Player',reason:'Illustrative profile — expected goals and actual output diverged.'},{name:'Jonas Adler',club:'Rheinburg 04',league:'Bundesliga',role:'Defender',score:80,category:'Player',reason:'Illustrative profile — inconsistency relative to expectations.'},{name:'Étienne Moreau',club:'Olympique Belleville',league:'Ligue 1',role:'Goalkeeper',score:77,category:'Goalkeeper',reason:'Illustrative profile — goalkeeping performance shortfall.'},{name:'Tiago Carvalho',club:'Atlético do Tejo',league:'Primeira Liga',role:'Forward',score:74,category:'Transfer',reason:'Illustrative profile — signing failed to meet anticipated impact.'}];
const leagues=['All leagues','Premier League','La Liga','Serie A','Bundesliga','Ligue 1','Primeira Liga'];const cats=['All categories','Player','Transfer','Goalkeeper'];let filters={league:'All leagues',category:'All categories',search:''};let sort='highest';
const ball=`<svg class="ball" viewBox="0 0 360 390" role="img" aria-label="Stylized wooden football trophy"><defs><radialGradient id="g" cx="34%" cy="27%" r="75%"><stop stop-color="#e4c6a0"/><stop offset=".45" stop-color="#b88a60"/><stop offset="1" stop-color="#6e4c32"/></radialGradient><linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8e765f"/><stop offset="1" stop-color="#35291f"/></linearGradient></defs><ellipse cx="180" cy="368" rx="104" ry="10" fill="#000" opacity=".08"/><path d="M144 292h72l14 33h-100z" fill="#856b53"/><rect x="104" y="323" width="152" height="40" rx="2" fill="url(#base)"/><circle cx="180" cy="153" r="135" fill="url(#g)" stroke="#61452e" stroke-width="2"/><g stroke="#61472e" stroke-width="3" fill="none" opacity=".86"><path d="M180 67l55 38-19 64h-72l-19-64z"/><path d="M180 67l-9-47M235 105l66-24M216 169l59 57M144 169l-59 57M125 105L59 81M144 169l-29 60 65 49 65-49-29-60M115 229l-41-6M245 229l41-6M180 278v10"/><path d="M59 81l-13 60 39 85M301 81l13 60-39 85M171 20l-52 16-60 45M189 20l52 16 60 45"/></g><g stroke="#e9d0ae" opacity=".24"><path d="M112 84l37 20M175 44l34 14M192 186l-25 34M80 160l23 29M237 255l-29 11"/></g><text x="180" y="347" text-anchor="middle" fill="#e7d4b9" font-size="12" font-family="Georgia" letter-spacing="1">B E B · 2 0 2 6</text></svg>`;
function home(){return `<div class="wrap"><section class="hero"><div><div class="eyebrow">An alternative football distinction · 2026</div><h1>BALLON<br>EN <em>BOIS.</em></h1><p class="lead">Great expectations.<br>Remarkable disappointment.</p><p class="sub">An independent, satirical look at the biggest gaps between promise and performance in European football.</p><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:32px"><a class="btn" href="#/nominees">Explore nominees ↗</a><a class="btn outline" href="#/rankings">View rankings</a></div></div><div class="heroart">${ball}</div></section><section class="section"><div class="sectionhead"><div><div class="eyebrow">The distinction</div><h2>Not the worst.<br>The most disappointing.</h2></div><p class="sub">Talent alone does not qualify a player for the wooden ball. Expectations do. We consider the promise, the price, and the performance.</p></div><div class="three"><a href="#/nominees" class="tile"><span class="num">01 / THE PLAYERS</span><div><h3>Nominees</h3><p>The names under consideration across Europe's six leagues.</p></div><span class="arr">↗</span></a><a href="#/rankings" class="tile"><span class="num">02 / THE MEASURE</span><div><h3>Rankings</h3><p>A transparent view of the expectation–performance gap.</p></div><span class="arr">↗</span></a><a href="#/methodology" class="tile"><span class="num">03 / THE STANDARD</span><div><h3>Methodology</h3><p>How the disappointment index is intended to work.</p></div><span class="arr">↗</span></a></div></section></div><div class="strip"><div class="wrap">${leagues.slice(1).map(x=>`<span>${x}</span>`).join('')}</div></div><section class="section wrap"><div class="sectionhead"><div><div class="eyebrow">2026 edition</div><h2>Where promise meets reality.</h2></div><a class="textlink" href="#/nominees">See the nominees ↗</a></div><p class="note">Preview content: nominee names, clubs and scores currently shown are fictional examples for layout testing. No real-world nominations or awards have been announced here.</p></section>`}
function pagehead(title,eyebrow,desc){return `<section class="pagehead"><div class="wrap"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${desc}</p></div></section>`}
function controls(){return `<div class="toolbar"><select aria-label="Filter by league" class="control" id="league">${leagues.map(x=>`<option ${filters.league===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Filter by award category" class="control" id="category">${cats.map(x=>`<option ${filters.category===x?'selected':''}>${x}</option>`).join('')}</select><input class="control search" id="search" placeholder="Search nominee or club" aria-label="Search nominees" value="${filters.search.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"></div>`}
function filtered(){return players.filter(p=>(filters.league==='All leagues'||p.league===filters.league)&&(filters.category==='All categories'||p.category===filters.category)&&(`${p.name} ${p.club}`.toLowerCase().includes(filters.search.toLowerCase()))).sort((a,b)=>sort==='highest'?b.score-a.score:a.score-b.score)}
function nominees(){return pagehead('The nominees.','The 2026 edition','Six leagues. One measure: the distance between what was promised and what was delivered.')+`<div class="wrap section" style="padding-top:0"><p class="note">Demonstration profiles only. All names, clubs and scores below are fictional and are not real nominations.</p>${controls()}<div id="results"></div></div>`}
function rankings(){return pagehead('The rankings.','The disappointment index','A comparative table designed to rank underperformance against preseason expectations.')+`<div class="wrap section" style="padding-top:0"><p class="note">Demonstration data only. All listed players, clubs and scores are fictional. Actual rankings require verified season statistics and editorial review.</p>${controls()}<div class="toolbar"><label for="sort" class="eyebrow" style="align-self:center">Sort</label><select id="sort" class="control"><option value="highest">Highest disappointment first</option><option value="lowest">Lowest disappointment first</option></select></div><div id="results"></div></div>`}
function methodology(){return pagehead('The methodology.','An accountable distinction','A framework for evaluating the difference between expectation and delivery.')+`<section class="section wrap"><div class="three">${[['40%','Performance versus expectations','Compare actual output with a position- and minutes-adjusted baseline.'],['25%','Investment expectations','Account for transfer fees, compensation and the public expectations they create.'],['20%','Impact on team','Evaluate contributions to team outcomes, adjusted for context.'],['15%','Errors & consistency','Assess significant errors and sustained underperformance.']].map(([n,t,d])=>`<div class="tile"><span class="num">${n}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}</div><p class="note">This is a proposed editorial framework, not a validated statistical model. Published assessments should cite sources, explain adjustments, and offer a corrections process. Satire and opinion should be clearly labeled.</p></section>`}
function drawResults(route){let items=filtered(),out=document.getElementById('results');if(!out)return;if(!items.length){out.innerHTML='<div class="empty">No nominees match these filters.</div>';return}if(route==='nominees'){out.innerHTML=`<div class="grid">${items.map(p=>`<article class="nominee"><div class="meta">${p.league} · ${p.category}</div><h3>${p.name}</h3><div class="club">${p.club} · ${p.role}</div><p class="sub" style="font-size:13px;margin-top:18px">${p.reason}</p><div class="score"><span>Illustrative index / 100</span><b>${p.score}</b></div></article>`).join('')}</div>`}else{out.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Rank</th><th>Nominee</th><th>League</th><th>Category</th><th>Index / 100</th></tr></thead><tbody>${items.map((p,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td><strong>${p.name}</strong><small>${p.club}</small></td><td>${p.league}</td><td>${p.category}</td><td class="scorepill">${p.score}</td></tr>`).join('')}</tbody></table></div>`}}
function render(){let route=location.hash.replace('#/','').split('?')[0]||'home';if(!['home','nominees','rankings','methodology'].includes(route))route='home';document.getElementById('app').innerHTML=({home,nominees,rankings,methodology})[route]();document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===route));document.getElementById('links').classList.remove('open');if(route==='nominees'||route==='rankings'){drawResults(route);['league','category','search'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',e=>{filters[id]=e.target.value;drawResults(route)}));if(route==='rankings')document.getElementById('sort').addEventListener('change',e=>{sort=e.target.value;drawResults(route)})}window.scrollTo(0,0)}document.getElementById('menu').onclick=()=>document.getElementById('links').classList.toggle('open');window.addEventListener('hashchange',render);render();
</script></body></html>
